name: OIDC Claim Probe (authorized research)
on:
  workflow_dispatch:
    inputs:
      audience:
        description: "OIDC audience to request"
        required: true
        default: "sts.amazonaws.com"
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token and decode claims
        env:
          AUD: ${{ inputs.audience }}
        run: |
          set -euo pipefail
          echo "Audience=$AUD"
          ENC_AUD=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["AUD"], safe=""))')
          HTTP_CODE=$(curl -sS -o /tmp/oidc.json -w "%{http_code}" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENC_AUD}" || true)
          echo "HTTP=$HTTP_CODE"
          head -c 300 /tmp/oidc.json; echo
          python3 <<'PY'
import json, base64, sys, os
raw = open('/tmp/oidc.json').read()
try:
    d = json.loads(raw)
except Exception as e:
    print('non-json', e)
    open('oidc-claims.json','w').write(json.dumps({'error':'non-json','http_body':raw[:500]}))
    sys.exit(0)
jwt = d.get('value') or d.get('token') or ''
if not jwt:
    print('no jwt field', list(d.keys()))
    open('oidc-claims.json','w').write(json.dumps({'error':'no-jwt','body':d}, default=str))
    sys.exit(0)
parts = jwt.split('.')
pad = '=' * ((4 - len(parts[1]) % 4) % 4)
payload = json.loads(base64.urlsafe_b64decode(parts[1] + pad))
print(json.dumps(payload, indent=2, sort_keys=True))
print('KEYS', sorted(payload.keys()))
# Keep only claims, never upload raw JWT
open('oidc-claims.json','w').write(json.dumps({
  'audience_requested': os.environ.get('AUD'),
  'claims': payload,
  'claim_keys': sorted(payload.keys()),
}, indent=2))
# Basic integrity assertions for research notes
assert payload.get('iss','').startswith('https://token.actions.githubusercontent.com')
print('iss_ok')
print('sub=', payload.get('sub'))
print('repository=', payload.get('repository'))
print('job_workflow_ref=', payload.get('job_workflow_ref'))
print('aud=', payload.get('aud'))
PY
      - name: Upload claims only (no JWT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-claims
          path: oidc-claims.json
          retention-days: 1
