name: OIDC Claim Probe (authorized research)
on:
  workflow_dispatch:
    inputs:
      audience:
        description: "OIDC audience to request"
        required: true
        default: "sts.amazonaws.com"
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token and decode claims
        env:
          AUD: ${{ inputs.audience }}
        run: |
          set -euo pipefail
          echo "Audience=$AUD"
          # Request token via Actions ID token endpoint
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["AUD"], safe=""))')" )
          echo "$TOKEN" > /tmp/oidc.json
          # Extract JWT (field may be value or token)
          JWT=$(python3 - <<'PY'
import json
d=json.load(open('/tmp/oidc.json'))
print(d.get('value') or d.get('token') or '')
PY
)
          if [ -z "$JWT" ]; then
            echo "FAILED to get JWT"
            cat /tmp/oidc.json | head -c 500
            exit 1
          fi
          # Decode payload only (no signature verify needed for claim inventory)
          python3 - <<'PY'
import json,base64,sys
jwt=open('/tmp/jwt.txt').read().strip() if False else """$JWT"""
# rewrite properly
PY
          echo "$JWT" > /tmp/jwt.txt
          python3 - <<'PY'
import json,base64
jwt=open('/tmp/jwt.txt').read().strip()
parts=jwt.split('.')
pad='='*((4-len(parts[1])%4)%4)
payload=json.loads(base64.urlsafe_b64decode(parts[1]+pad))
# Redact nothing critical - this is our own token; print claims for research
print(json.dumps({k:payload.get(k) for k in sorted(payload)}, indent=2))
# Also print raw keys
print('KEYS', sorted(payload.keys()))
PY
          # Save claims artifact (JWT itself not uploaded - only claims)
          python3 - <<'PY'
import json,base64
jwt=open('/tmp/jwt.txt').read().strip()
parts=jwt.split('.')
pad='='*((4-len(parts[1])%4)%4)
payload=json.loads(base64.urlsafe_b64decode(parts[1]+pad))
json.dump(payload, open('oidc-claims.json','w'), indent=2)
PY
      - name: Upload claims only
        uses: actions/upload-artifact@v4
        with:
          name: oidc-claims
          path: oidc-claims.json
          retention-days: 1
