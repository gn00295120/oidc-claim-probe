name: oidc-claim-probe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oidc-claim-probe.yml"
      - "scripts/**"
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        audience:
          - "https://github.com/github"
          - "https://github.com/GitHub"
          - "https://github.com/github/"
          - "https://github.com/github "
          - "https://github.com/github%2ecom"
          - "https://github.com/actions"
          - "https://github.com/github/oidc-claim-probe"
          - "https://api.github.com"
          - "https://github.com"
          - "github.com/github"
          - "https://github.com/github?x=1"
          - "https://github.com/github#"
          - "https://github.com/github\t"
          - "https://github.com/gn00295120"
          - "https://github.com/github-production"
    steps:
      - uses: actions/checkout@v4
      - name: Decode OIDC claims
        env:
          AUD: ${{ matrix.audience }}
        run: python3 scripts/decode_oidc.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-claims-${{ strategy.job-index }}
          path: oidc-claims.json
          retention-days: 1
