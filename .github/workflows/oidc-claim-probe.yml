name: oidc-claim-probe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oidc-claim-probe.yml"
      - "probe-aud.txt"
      - "scripts/**"
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode OIDC claims
        run: python3 scripts/decode_oidc.py
      - name: Upload claims only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-claims
          path: oidc-claims.json
          retention-days: 1
