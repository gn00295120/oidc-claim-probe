name: fulcio-fixed-probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  fulcio:
    runs-on: ubuntu-latest
    steps:
      - name: Fulcio signingCert with correct key encoding
        run: |
          set -euo pipefail
          mkdir -p out
          pip3 -q install --user cryptography
          export PATH="$HOME/.local/bin:$PATH"
          python3 <<'PY2'
          import os, json, base64, urllib.request, urllib.error, urllib.parse, subprocess
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import serialization, hashes
          out=Path("out")
          url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          rtok=os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          def mint(aud):
              sep="&" if "?" in url else "?"
              q=urllib.parse.urlencode({"audience":aud})
              req=urllib.request.Request(url+sep+q, headers={"Authorization":f"bearer {rtok}","Accept":"application/json; api-version=2.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)["value"]

          def claims_of(jwt):
              return json.loads(base64.urlsafe_b64decode(jwt.split(".")[1]+"===="))

          key = ec.generate_private_key(ec.SECP256R1())
          pub_der = key.public_key().public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          pub_b64 = base64.b64encode(pub_der).decode()
          results=[]
          for aud in ["sigstore"]:
              jwt = mint(aud)
              c=claims_of(jwt)
              keep={k:c.get(k) for k in ["sub","aud","iss","repository","job_workflow_ref","repository_id","actor"]}
              msg = c.get("sub","").encode()
              sig = key.sign(msg, ec.ECDSA(hashes.SHA256()))
              proof = base64.b64encode(sig).decode()
              payloads = [
                ("v1", {"publicKey":{"content":pub_b64,"algorithm":"ecdsa"},"signedEmailAddress":proof,"identityToken":jwt}),
                ("v2", {"credentials":{"oidcIdentityToken":jwt},"publicKeyRequest":{"publicKey":{"algorithm":"ECDSA_P256_SHA_256","content":pub_b64},"proofOfPossession":proof}}),
              ]
              for label, body in payloads:
                  for ep in [
                    "https://fulcio.githubapp.com/api/v1/signingCert",
                    "https://fulcio.githubapp.com/api/v2/signingCert",
                    "https://fulcio.sigstore.dev/api/v1/signingCert",
                    "https://fulcio.sigstore.dev/api/v2/signingCert",
                  ]:
                      data=json.dumps(body).encode()
                      req=urllib.request.Request(ep, data=data, method="POST", headers={
                          "Content-Type":"application/json",
                          "Accept":"application/pem-certificate-chain",
                          "User-Agent":"lucasfutures-research",
                          "X-HackerOne-Research":"lucasfutures",
                      })
                      try:
                          with urllib.request.urlopen(req, timeout=30) as resp:
                              b=resp.read().decode("utf-8","replace")
                              rec={"aud":aud,"claims":keep,"ep":ep,"label":label,"status":resp.status,"has_cert":"BEGIN CERTIFICATE" in b,"len":len(b)}
                              if "BEGIN CERTIFICATE" in b:
                                  open("/tmp/c.pem","w").write(b)
                                  try:
                                      meta=subprocess.check_output(["openssl","x509","-in","/tmp/c.pem","-noout","-subject","-issuer","-ext","subjectAltName"], text=True, stderr=subprocess.STDOUT)
                                  except subprocess.CalledProcessError as e:
                                      meta=e.output
                                  rec["cert_meta"]=meta[:800]
                                  open(f"out/cert-{label}-{ep.split('/')[2]}.pem","w").write(b)
                              results.append(rec)
                              print("OK", {k:rec[k] for k in rec if k!='claims'}, keep)
                      except urllib.error.HTTPError as e:
                          body=e.read().decode("utf-8","replace")
                          rec={"aud":aud,"claims":keep,"ep":ep,"label":label,"status":e.code,"body":body[:300]}
                          results.append(rec)
                          print("HTTP", rec)
              jwt=None
          (out/"results.json").write_text(json.dumps(results,indent=2))
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: fulcio-fixed-out
          path: out/
